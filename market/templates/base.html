```html
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% block title %}
    {% endblock %}
  </title>

  <style>
    :root {
      --fd-ink: #1c2530;
      --fd-muted: #5f6b7a;
      --fd-line: #dde2e8;
      --fd-surface: #ffffff;
      --fd-page: #f4f6f8;
      --fd-accent: #0d7a6f;
      --fd-accent-hover: #0a5f56;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background-color: var(--fd-page);
      color: var(--fd-ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    /* =========================
       NAVBAR
       ========================= */

    .fd-navbar {
      width: 100%;
      background-color: var(--fd-surface);
      border-bottom: 1px solid var(--fd-line);
    }

    .fd-navbar-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .fd-brand {
      color: var(--fd-ink);
      text-decoration: none;
      font-size: 19px;
      font-weight: 700;
      white-space: nowrap;
    }

    .fd-brand:hover {
      color: var(--fd-accent);
      text-decoration: none;
    }

    .fd-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .fd-nav-link {
      display: inline-block;
      padding: 8px 12px;

      color: var(--fd-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;

      border: 1px solid transparent;
      border-radius: 5px;

      transition:
        color 0.15s ease,
        background-color 0.15s ease,
        border-color 0.15s ease;
    }

    .fd-nav-link:hover {
      color: var(--fd-accent);
      background-color: var(--fd-page);
      text-decoration: none;
    }

    .fd-nav-link.active {
      color: var(--fd-accent);
    }

    /* =========================
       CONTENIDO PRINCIPAL
       ========================= */

    .fd-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* =========================
       FLASH MESSAGES
       ========================= */

    .fd-flash-container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px 0;
    }

    .fd-alert {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;

      padding: 12px 14px;

      background-color: var(--fd-surface);
      color: var(--fd-ink);

      border: 1px solid var(--fd-line);
      border-left: 3px solid var(--fd-accent);
      border-radius: 5px;

      font-size: 14px;
    }

    .fd-alert strong {
      font-weight: 600;
    }

    .fd-alert-close {
      padding: 0;
      border: 0;
      background: transparent;

      color: var(--fd-muted);
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }

    .fd-alert-close:hover {
      color: var(--fd-ink);
    }

    /* =========================
       BOTONES GENERALES
       ========================= */

    .fd-button {
      display: inline-block;
      padding: 9px 14px;

      background-color: var(--fd-accent);
      color: #ffffff;

      border: 1px solid var(--fd-accent);
      border-radius: 5px;

      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;

      transition:
        background-color 0.15s ease,
        border-color 0.15s ease;
    }

    .fd-button:hover {
      background-color: var(--fd-accent-hover);
      border-color: var(--fd-accent-hover);
      color: #ffffff;
      text-decoration: none;
    }

    /* =========================
       TARJETAS
       ========================= */

    .fd-card {
      background-color: var(--fd-surface);
      border: 1px solid var(--fd-line);
      border-radius: 6px;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 768px) {

      .fd-navbar-container {
        padding: 0 16px;
      }

      .fd-container {
        padding: 20px 16px;
      }

      .fd-flash-container {
        padding: 12px 16px 0;
      }

      .fd-nav {
        gap: 2px;
      }

      .fd-nav-link {
        padding: 7px 9px;
      }
    }

    @media (max-width: 576px) {

      .fd-navbar-container {
        min-height: 56px;
      }

      .fd-brand {
        font-size: 17px;
      }

      .fd-nav-link {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVBAR
       ========================= -->

  <nav class="fd-navbar">

    <div class="fd-navbar-container">

      <a class="fd-brand" href="#">
        Online Store
      </a>

      <ul class="fd-nav">

        <li>
          <a
            class="fd-nav-link active"
            href="{{ url_for('homePage') }}"
          >
            Home
          </a>
        </li>

      </ul>

      {% block navBar %}
      {% endblock %}

    </div>

  </nav>


  <!-- =========================
       FLASH MESSAGES
       ========================= -->

  {% block flash %}

  <div class="fd-flash-container">

    {% for message in get_flashed_messages() %}

      <div class="fd-alert" role="alert">

        <strong>
          {{ message }}
        </strong>

        <button
          type="button"
          class="fd-alert-close"
          onclick="this.parentElement.remove()"
          aria-label="Close"
        >
          &times;
        </button>

      </div>

    {% endfor %}

  </div>

  {% endblock %}


  <!-- =========================
       CONTENIDO DE LAS VISTAS
       ========================= -->

  {% block content %}
  {% endblock %}

</body>

</html>
```
