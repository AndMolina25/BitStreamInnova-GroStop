```jinja2
{% extends 'base.html' %}

{% block title %}
  User Choice
{% endblock %}

{% block content %}

<style>
  .fd-user-choice-page {
    min-height: calc(100vh - 65px);
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 24px;
    background-color: var(--fd-page);
    box-sizing: border-box;
  }

  .fd-user-choice-card {
    width: 100%;
    max-width: 1400px;
    min-height: calc(100vh - 113px);
    display: grid;
    grid-template-columns: 55% 45%;
    overflow: hidden;
    background-color: var(--fd-surface);
    border: 1px solid var(--fd-line);
    border-radius: 8px;
    box-sizing: border-box;
  }

  /* ---------------------------------
     LEFT: PRESENTATION
     --------------------------------- */

  .fd-user-choice-presentation {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px;
    background-color: var(--fd-page);
    border-right: 1px solid var(--fd-line);
    box-sizing: border-box;
  }

  .fd-user-choice-image-wrapper {
    width: 100%;
    max-width: 720px;
  }

  .fd-user-choice-image {
    display: block;
    width: 100%;
    min-height: 520px;
    max-height: 680px;
    object-fit: cover;
    border: 1px solid var(--fd-line);
    border-radius: 8px;
  }

  /* ---------------------------------
     RIGHT: INTERACTIVE CONTENT
     --------------------------------- */

  .fd-user-choice-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 56px;
    background-color: var(--fd-surface);
    box-sizing: border-box;
  }

  .fd-user-choice-content-inner {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  .fd-user-choice-eyebrow {
    margin: 0 0 10px;
    color: var(--fd-accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .fd-user-choice-title {
    margin: 0 0 32px;
    color: var(--fd-ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.3;
  }

  .fd-user-choice-options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    width: 100%;
  }

  .fd-user-choice-option {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: 12px 20px;
    box-sizing: border-box;
    background-color: var(--fd-accent);
    color: #ffffff;
    border: 1px solid var(--fd-accent);
    border-radius: 5px;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition:
      background-color 0.15s ease,
      border-color 0.15s ease;
  }

  .fd-user-choice-option:hover {
    background-color: var(--fd-accent-hover);
    border-color: var(--fd-accent-hover);
    color: #ffffff;
    text-decoration: none;
  }

  .fd-user-choice-option:active {
    opacity: 0.9;
  }

  /* ---------------------------------
     TABLET
     --------------------------------- */

  @media (max-width: 1100px) {
    .fd-user-choice-card {
      grid-template-columns: 50% 50%;
    }

    .fd-user-choice-presentation {
      padding: 32px;
    }

    .fd-user-choice-content {
      padding: 40px;
    }

    .fd-user-choice-image {
      min-height: 460px;
    }
  }

  /* ---------------------------------
     MOBILE
     --------------------------------- */

  @media (max-width: 768px) {
    .fd-user-choice-page {
      min-height: auto;
      padding: 16px;
    }

    .fd-user-choice-card {
      min-height: auto;
      grid-template-columns: 1fr;
    }

    .fd-user-choice-presentation {
      padding: 24px;
      border-right: none;
      border-bottom: 1px solid var(--fd-line);
    }

    .fd-user-choice-image {
      min-height: 280px;
      max-height: 380px;
    }

    .fd-user-choice-content {
      padding: 36px 28px;
    }

    .fd-user-choice-content-inner {
      max-width: 100%;
    }
  }

  @media (max-width: 576px) {
    .fd-user-choice-page {
      padding: 0;
    }

    .fd-user-choice-card {
      border-right: none;
      border-left: none;
      border-radius: 0;
    }

    .fd-user-choice-presentation {
      padding: 20px 16px;
    }

    .fd-user-choice-image {
      min-height: 220px;
      max-height: 280px;
    }

    .fd-user-choice-content {
      padding: 32px 20px;
    }

    .fd-user-choice-title {
      font-size: 23px;
    }
  }
</style>

<form method="POST" action="">
  <div class="fd-user-choice-page">

    <div class="fd-user-choice-card">

      <!-- LEFT: PRESENTATION IMAGE -->
      <section class="fd-user-choice-presentation">

        <div class="fd-user-choice-image-wrapper">

          <img
            src="{{url_for('static', filename='store.jpg')}}"
            class="fd-user-choice-image"
            alt="Online Store"
          />

        </div>

      </section>

      <!-- RIGHT: INTERACTIVE CONTENT -->
      <section class="fd-user-choice-content">

        <div class="fd-user-choice-content-inner">

          <p class="fd-user-choice-eyebrow">
            User
          </p>

          <p class="fd-user-choice-title">
            PLEASE REGISTER OR LOGIN AS GIVEN BELOW
          </p>

          <div class="fd-user-choice-options">

            <a
              class="fd-user-choice-option"
              href="{{url_for('UserLogin')}}"
            >
              Login
            </a>

            <a
              class="fd-user-choice-option"
              href="{{url_for('customerRegister')}}"
            >
              Register
            </a>

          </div>

        </div>

      </section>

    </div>

  </div>
</form>

{% endblock %}
```
