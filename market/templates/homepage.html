```jinja2
{% extends 'base.html' %}

{% block title %}
  Welcome to Online Store
{% endblock %}

{% block content %}

<style>
  .fd-home-page {
    min-height: calc(100vh - 65px);
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: 24px;
    background-color: var(--fd-page);
  }

  .fd-home-card {
    width: 100%;
    max-width: 1400px;
    min-height: calc(100vh - 113px);
    display: grid;
    grid-template-columns: 55% 45%;
    overflow: hidden;
    background-color: var(--fd-surface);
    border: 1px solid var(--fd-line);
    border-radius: 8px;
  }

  /* ---------------------------------
     LEFT: PRESENTATION
     --------------------------------- */

  .fd-home-presentation {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px;
    background-color: var(--fd-page);
    border-right: 1px solid var(--fd-line);
  }

  .fd-home-image-wrapper {
    width: 100%;
    max-width: 720px;
  }

  .fd-home-image {
    display: block;
    width: 100%;
    height: 100%;
    min-height: 520px;
    max-height: 680px;
    object-fit: cover;
    border: 1px solid var(--fd-line);
    border-radius: 8px;
  }

  /* ---------------------------------
     RIGHT: INTERACTIVE CONTENT
     --------------------------------- */

  .fd-home-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 56px;
    background-color: var(--fd-surface);
  }

  .fd-home-content-inner {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
  }

  .fd-home-eyebrow {
    margin: 0 0 10px;
    color: var(--fd-accent);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .fd-home-title {
    margin: 0 0 14px;
    color: var(--fd-ink);
    font-size: 28px;
    font-weight: 600;
    line-height: 1.3;
  }

  .fd-home-description {
    margin: 0 0 32px;
    color: var(--fd-muted);
    font-size: 15px;
    line-height: 1.6;
  }

  .fd-login-options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .fd-login-option {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 52px;
    padding: 12px 18px;
    color: #ffffff;
    background-color: var(--fd-accent);
    border: 1px solid var(--fd-accent);
    border-radius: 5px;
    text-decoration: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    transition:
      background-color 0.15s ease,
      border-color 0.15s ease;
  }

  .fd-login-option:hover {
    color: #ffffff;
    background-color: var(--fd-accent-hover);
    border-color: var(--fd-accent-hover);
    text-decoration: none;
  }

  .fd-login-option:active {
    opacity: 0.85;
  }

  /* ---------------------------------
     TABLET
     --------------------------------- */

  @media (max-width: 1100px) {
    .fd-home-card {
      grid-template-columns: 50% 50%;
    }

    .fd-home-presentation {
      padding: 32px;
    }

    .fd-home-content {
      padding: 40px;
    }

    .fd-home-image {
      min-height: 460px;
    }
  }

  /* ---------------------------------
     MOBILE
     --------------------------------- */

  @media (max-width: 768px) {
    .fd-home-page {
      min-height: auto;
      padding: 16px;
    }

    .fd-home-card {
      min-height: auto;
      grid-template-columns: 1fr;
    }

    .fd-home-presentation {
      padding: 24px;
      border-right: none;
      border-bottom: 1px solid var(--fd-line);
    }

    .fd-home-image {
      min-height: 280px;
      max-height: 380px;
    }

    .fd-home-content {
      padding: 36px 28px;
    }

    .fd-home-content-inner {
      max-width: 100%;
    }
  }

  @media (max-width: 576px) {
    .fd-home-page {
      padding: 0;
    }

    .fd-home-card {
      border-right: none;
      border-left: none;
      border-radius: 0;
    }

    .fd-home-presentation {
      padding: 20px 16px;
    }

    .fd-home-image {
      min-height: 220px;
      max-height: 280px;
    }

    .fd-home-content {
      padding: 32px 20px;
    }

    .fd-home-title {
      font-size: 23px;
    }

    .fd-home-description {
      font-size: 14px;
    }
  }
</style>

<form method="POST" action="">
  <div class="fd-home-page">

    <div class="fd-home-card">

      <!-- LEFT: PRESENTATION IMAGE -->
      <section class="fd-home-presentation">

        <div class="fd-home-image-wrapper">

          <img
            src="{{url_for('static', filename='store.jpg')}}"
            class="fd-home-image"
            alt="Online Store"
          >

        </div>

      </section>

      <!-- RIGHT: INTERACTIVE CONTENT -->
      <section class="fd-home-content">

        <div class="fd-home-content-inner">

          <p class="fd-home-eyebrow">
            Online Store
          </p>

          <h1 class="fd-home-title">
            PLEASE LOGIN ACCORDING TO YOUR CHOICE
          </h1>

          <p class="fd-home-description">
            Select how you want to enter the online store.
          </p>

          <div class="fd-login-options">

            <a
              class="fd-login-option"
              href="{{url_for('loginRegisterUser')}}"
            >
              Enter as User
            </a>

            <a
              class="fd-login-option"
              href="{{url_for('loginRegisterAdmin')}}"
            >
              Enter as Admin
            </a>

            <a
              class="fd-login-option"
              href="{{url_for('loginRegisterSeller')}}"
            >
              Enter as Seller
            </a>

          </div>

        </div>

      </section>

    </div>

  </div>
</form>

{% endblock %}
```
